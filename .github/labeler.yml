skill:
  - changed-files:
    - any-glob-to-any-file: ['skills/**']

command:
  - changed-files:
    - any-glob-to-any-file: ['commands/**']

documentation:
  - changed-files:
    - any-glob-to-any-file: ['*.md', 'docs/**']

ci:
  - changed-files:
    - any-glob-to-any-file: ['.github/**']

dependencies:
  - changed-files:
    - any-glob-to-any-file: ['package.json', 'package-lock.json', '.github/dependabot.yml']
